<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 - CSS</title>
</head>
<body>
    <!-- 
        HTML5 không phân biệt viết hoa, thường
        Semantic Tags(ngữ nghĩa): Các thẻ đại diện các 
        thành phần layout (bố cục trang) trên trang web
        - header (đầu trang), nav (Navigation - điều thường),
        article (chiếm 80%, bài viết (text)), aside (chiếm
        20%, bên trái hoặc bên phải, bên trái hoặc bên phải),
        footer (chân trang)
    -->
    <header>
        <!-- <h6>Tiêu đề trang</h6>
        <span>Logo</span>
        <span>Slogan của trang web</span> -->
        <marquee>Học để thay đổi</marquee>
    </header>
    <nav>
        <img src="" alt="">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Liên hệ</a></li>
            <li><a href="#">Bài viết</a></li>
            <li><a href="#">Cài đặt</a></li>
        </ul>
    </nav>
    <main>
        <!-- Chứa một nội dung chính của trang web -->
        <article>
            <!-- Chứa một bài viết, tin tức 80% -->
        </article>
        <aside>
            <!-- Chứa nội dung liên quan 20% -->
        </aside>
    </main>
    <footer>
        <!-- Chân trang: Chứa thông tin về tác giả, bản quyền,
           liên hệ, link liên kế,v.v... -->
    </footer>
</body>
</html>
