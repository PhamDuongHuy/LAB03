<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <!-- 
        Cách 2: internal CSS
        viết CSS trong file .html, viết trong cặp thẻ style. 
        Thẻ style phải đặt trong head 
    -->
        <style>
            /* 
                selector{
                    thuộc tính: giá trị;
                    thuộc tính: giá trị;
                }
            */
            h1{
                color: blueviolet;
            }
            * {
                font-family: 'Times New Roman', Times, serif;
            }
        </style>
</head>
<body>
    <!-- 3 cách viết css: inline, internal, external -->
    <!-- Cách 1. Inline css -->
    <p style="font-size: 50px; color: blue; font-weight: 900;">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Sed id deleniti harum qui! Velit quis et quia culpa odio
        ex, error debitis quidem necessitatibus corrupti, eius corporis neque eligendi repellat.\
    </p>
    <h1>CNTT 20-01</h1>
    <h1>CNTT 20-02</h1>
    <h1>CNTT 20-03</h1>
</body>

</html>
